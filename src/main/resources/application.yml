spring:
  application:
    name: fake-store-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_PUBLIC_JWT_URL}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/auth/**
              filters:
                - PreserveHostHeader
                - DedupeResponseHeader=Set-Cookie


            - id: user-endpoints
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/users/**

            - id: product-service
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/products/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/orders/**

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL}
              predicates:
                - Path=/api/inventory/**

            - id: cart-service
              uri: ${CART_SERVICE_URL}
              predicates:
                - Path=/api/cart/**
              filters:
                - PreserveHostHeader
                - DedupeResponseHeader=Set-Cookie



server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security.web.server.authorization.AuthorizationWebFilter: TRACE
    org.springframework.security.web.server.util.matcher: TRACE



